html,body{margin:0;padding:0;}

  const idx = state.pos;
  return Math.min(100, Math.round((idx/(state.flow.length-2))*100));
}

function topbar(showBack, phaseLabel){
  return `<div class="topbar">
    ${showBack? `<button class="back-btn" onclick="prevScreen()">‹</button>` : `<span style="width:20px"></span>`}
    <div style="flex:1">
      <div class="phase-label">${phaseLabel||""}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct()}%"></div></div>
    </div>
  </div>`;
}

function renderQuestionScreen(step){
  const multi = step.type==="multi";
  const currentVal = state.answers[step.id];
  let optsHtml = "";

  if(step.optType==="swatch"){
    optsHtml = `<div class="options grid2">` + step.options.map((o,i)=>{
      const selected = multi ? (Array.isArray(currentVal)&&currentVal.includes(i)) : currentVal===i;
      const imgTag = o.img
        ? `<img src="${CONFIG.imgBase}${o.img}.png" alt="${esc(o.label)}" onerror="this.style.display='none'">`
        : "";
      return `<div class="opt-img ${selected?'selected':''}" onclick="selectOption('${step.id}',${i},${multi})">
        <div class="swatch" style="background:${o.swatch}">${imgTag}</div>
        <div class="cap">${esc(o.label)}</div>
      </div>`;
    }).join("") + `</div>`;
  } else if(step.optType==="dot"){
    optsHtml = `<div class="options">` + step.options.map((o,i)=>{
      const selected = multi ? (Array.isArray(currentVal)&&currentVal.includes(i)) : currentVal===i;
      return `<div class="opt ${selected?'selected':''}" onclick="selectOption('${step.id}',${i},${multi})">
        <span style="display:flex;align-items:center;gap:10px;"><span class="opt-color-dot" style="background:${o.swatch}"></span>${esc(o.label)}</span>
      </div>`;
    }).join("") + `</div>`;
  } else {
    optsHtml = `<div class="options">` + step.options.map((o,i)=>{
      const selected = multi ? (Array.isArray(currentVal)&&currentVal.includes(i)) : currentVal===i;
      return `<div class="opt ${selected?'selected':''}" onclick="selectOption('${step.id}',${i},${multi})">${esc(o.label)}</div>`;
    }).join("") + `</div>`;
  }

  const needsBtn = multi;
  const canContinue = multi ? (Array.isArray(currentVal) && currentVal.length>0) : true;

  return `<div class="screen" id="scr-${step.id}">
    ${topbar(true, (PHASE_META[step.phase]||{}).label)}
    <div class="q-title">${esc(step.title)}</div>
    ${step.sub? `<div class="q-sub">${esc(step.sub)}</div>` : ""}
    ${optsHtml}
    ${needsBtn? `<div class="btn-row"><button class="btn btn-primary" id="continueBtn-${step.id}" ${canContinue?'':'disabled'} onclick="nextScreen()">Continuar</button></div>` : ""}
  </div>`;
}

function selectOption(stepId, idx, multi){
  if(multi){
    const arr = state.answers[stepId] || [];
    const pos = arr.indexOf(idx);
    if(pos>-1) arr.splice(pos,1); else arr.push(idx);
    state.answers[stepId] = arr;
    renderCurrentScreen(); // re-render to reflect selection + button state
  } else {
    state.answers[stepId] = idx;
    const step = QUIZ_STEPS.find(s=>s.id===stepId);
    const opt = step.options[idx];
    if(opt.deltas){
      for(const k in opt.deltas){ state.scores[k] = (state.scores[k]||0) + opt.deltas[k]; }
    }
    renderCurrentScreen();
    setTimeout(()=>{ nextScreen(); }, 260);
  }
}

function runAnalysisSequence(){
  const bars = [["af1","ap1"],["af2","ap2"],["af3","ap3"]];
  let i=0;
  function step(){
    if(i>=bars.length){
      setTimeout(()=>{ document.getElementById("modalTryOn").classList.add("active"); }, 400);
      return;
    }
    const [fillId,pctId] = bars[i];
    let p=0;
    const iv = setInterval(()=>{
      p += 4;
      if(p>100) p=100;
      document.getElementById(fillId).style.width = p+"%";
      document.getElementById(pctId).textContent = p+"%";
      if(p>=100){ clearInterval(iv); i++; setTimeout(step, 200); }
    }, 35);
  }
  step();
}

/* =====================================================================
   CÁLCULO DEL RESULTADO
   ===================================================================== */
function computeResult(){
  const s = state.scores;
  const warm = s.warm||0, bright = s.bright||0, deep = s.deep||0, contrast = s.contrast||0;
  let group, sub;
  if(warm >= 0){
    if(bright >= 0){
      group="spring";
      if(deep < -1) sub="light_spring";
      else if(bright > 4) sub="bright_spring";
      else sub="true_spring";
    } else {
      group="autumn";
      if(deep > 1) sub="dark_autumn";
      else if(bright < -3) sub="soft_autumn";
      else sub="true_autumn";
    }
  } else {
    if(bright >= 0 || contrast >= 1){
      group="winter";
      if(deep > 1) sub="dark_winter";
      else if(bright > 4) sub="bright_winter";
      else sub="true_winter";
    } else {
      group="summer";
      if(deep < -1) sub="light_summer";
      else if(bright < -3) sub="soft_summer";
      else sub="true_summer";
    }
  }
  state.resultId = sub;
}

/* =====================================================================
   RUEDA SVG
   ===================================================================== */
function buildWheelSVG(highlightId, size, startDeg){
  const start = (typeof startDeg==="number") ? startDeg*Math.PI/180 : -Math.PI/2;
  const cx=size/2, cy=size/2, r=size/2-6, rInner=r*0.42;
  let paths="";
  const n=12;
  for(let i=0;i<n;i++){
    const a0 = start + (i/n)*2*Math.PI;
    const a1 = start + ((i+1)/n)*2*Math.PI;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const isHighlight = WHEEL_ORDER[i]===highlightId;
    const op = highlightId ? (isHighlight? 1 : 0.28) : 1;
    paths += `<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z"
      fill="${WHEEL_COLORS[i]}" opacity="${op}" stroke="#FBF6EC" stroke-width="1.5"/>`;
  }
  return `<svg viewBox="0 0 ${size} ${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${rInner}" fill="#3B1B47"/></svg>`;
}

const WHEEL_SHORT_LABEL = {
  bright_winter:"Brillante", true_winter:"Frío", dark_winter:"Profundo",
  bright_spring:"Brillante", true_spring:"Cálida", light_spring:"Clara",
  light_summer:"Claro", true_summer:"Frío", soft_summer:"Suave",
  soft_autumn:"Suave", true_autumn:"Cálido", dark_autumn:"Profundo"
};
const GROUP_LABELS_ES = {winter:"INVIERNO", spring:"PRIMAVERA", summer:"VERANO", autumn:"OTOÑO"};
const GROUP_ICON = {winter:"❄️", spring:"🌸", summer:"☀️", autumn:"🍂"};
function groupOfSeason(id){ return SEASON_DATA[id].group==="INVIERNO"?"winter":SEASON_DATA[id].group==="PRIMAVERA"?"spring":SEASON_DATA[id].group==="VERANO"?"summer":"autumn"; }

/* Rueda de resultados: 4 grupos en las esquinas (con espacio para foto),
   círculo central "TÚ" y una etiqueta que apunta a tu estación exacta. */
function buildResultWheel(highlightId, size, centerText){
  const wheelSize = Math.round(size*0.6);
  const svg = buildWheelSVG(highlightId, wheelSize, -180);
  const idx = highlightId ? WHEEL_ORDER.indexOf(highlightId) : -1;
  let pointerHtml = "";
  if(idx>-1){
    const midDeg = -180 + idx*30 + 15;
    const midRad = midDeg*Math.PI/180;
    const R = (wheelSize/2)*1.14;
    const px = size/2 + R*Math.cos(midRad);
    const py = size/2 + R*Math.sin(midRad);
    pointerHtml = `<div class="rw-pointer" style="left:${px.toFixed(1)}px; top:${py.toFixed(1)}px;">★ ${WHEEL_SHORT_LABEL[highlightId]}</div>`;
  }

  const corners = [
    {g:"winter", cls:"rw-tl"}, {g:"spring", cls:"rw-tr"},
    {g:"summer", cls:"rw-br"}, {g:"autumn", cls:"rw-bl"}
  ];
  const activeGroup = highlightId ? groupOfSeason(highlightId) : null;
  const cornersHtml = corners.map(c=>{
    const active = activeGroup===c.g;
    return `<div class="rw-corner ${c.cls} ${active?'active':''}">
      <div class="rw-label">${GROUP_LABELS_ES[c.g]}</div>
    </div>`;
  }).join("");

  return `<div class="result-wheel" style="width:${size}px;height:${size}px;">
    ${cornersHtml}
    <div class="rw-svg-wrap" style="width:${wheelSize}px;height:${wheelSize}px;">${svg}</div>
    <div class="rw-center">${centerText||"TÚ"}</div>
    ${pointerHtml}
  </div>`;
}

        ${esc(CONFIG.brandName)}. Este producto es una guía de estilo personal y no reemplaza el asesoramiento de un profesional de imagen en cabina.<br>
        <a href="#">Política de privacidad</a> · <a href="#">Términos</a> · <a href="mailto:${esc(CONFIG.supportEmail)}">${esc(CONFIG.supportEmail)}</a><br>
        © ${new Date().getFullYear()} ${esc(CONFIG.brandName)}. Todos los derechos reservados.
      </div>
    </div>
  </div>`;
}

function getAnswerLabel(stepId){
  const step = QUIZ_STEPS.find(s=>s.id===stepId);
  const idx = state.answers[stepId];
  if(step && typeof idx==="number" && step.options[idx]) return step.options[idx].label.toLowerCase();
  return "";
}

function toggleFaq(el){
  el.parentElement.classList.toggle("open");
}
function scrollToOffer(){
  const el = document.getElementById("offerAnchor");
  if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
}
function goToCheckout(method){
  if(typeof fbq==="function"){ fbq('track','InitiateCheckout'); }
  const url = method==="mp" ? CONFIG.mpCheckoutUrl : CONFIG.cardCheckoutUrl;
  window.location.href = url;
}

let countdownInterval=null;
function startCountdown(){
  let total = CONFIG.countdownMinutes*60;
  const timerEl = document.getElementById("timer");
  if(!timerEl) return;
  clearInterval(countdownInterval);
  countdownInterval = setInterval(()=>{
    total--;
    if(total<0) total=0;
    const m = String(Math.floor(total/60)).padStart(2,"0");
    const s = String(total%60).padStart(2,"0");
    timerEl.textContent = `${m}:${s}`;
    if(total<=0) clearInterval(countdownInterval);
  },1000);
}

/* =====================================================================
   ROUTER
   ===================================================================== */
function buildScreenHtml(id){
  if(id==="intro") return screenIntro();
  if(id==="reveal") return screenReveal();
  if(id==="single-photo") return screenSinglePhoto();
  if(id.startsWith("phase-complete-")) return phaseCompleteScreen(parseInt(id.split("-").pop()));
  if(id==="goals-confirm") return screenGoalsConfirm();
  if(id==="analysis") return screenAnalysis();
  if(id==="email") return screenEmail();
  if(id==="results") return screenResults();
  const step = QUIZ_STEPS.find(s=>s.id===id);
  if(step) return renderQuestionScreen(step);
  return `<div class="screen"><p>Pantalla no encontrada: ${id}</p></div>`;
}

function renderCurrentScreen(){
  const id = state.flow[state.pos];
  screensEl.innerHTML = buildScreenHtml(id);
  const scrEl = screensEl.querySelector(".screen");
  if(scrEl) scrEl.classList.add("active");
  window.scrollTo(0,0);

  if(id==="analysis"){ setTimeout(runAnalysisSequence, 300); }
  if(id==="results"){ startCountdown(); }
}

function nextScreen(){
  if(state.pos < state.flow.length-1){
    state.pos++;
    renderCurrentScreen();
  }
}
function prevScreen(){
  if(state.pos>0){
    state.pos--;
    renderCurrentScreen();
  }
}

/* init */
renderCurrentScreen();
</script>
